name: Build iOS IPA
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  build:
    runs-on: macos-15
    steps:
      - uses: actions/checkout@v4
      - name: Generate demo music
        run: |
          python3 - <<'PY'
          import wave, math, struct, os
          os.makedirs('Player',exist_ok=True)
          rate=22050
          melody=[(261.63,.4),(329.63,.4),(392,.4),(523.25,.7),(392,.4),(329.63,.4),(293.66,.4),(349.23,.7),(329.63,.4),(261.63,.7)]
          with wave.open('Player/demo.wav','wb') as w:
              w.setnchannels(1);w.setsampwidth(2);w.setframerate(rate)
              for _ in range(5):
                  for freq,sec in melody:
                      n=int(rate*sec)
                      for i in range(n):
                          env=min(1,i/(rate*.02), (n-i)/(rate*.07))
                          v=int(8000*env*(math.sin(2*math.pi*freq*i/rate)+.22*math.sin(4*math.pi*freq*i/rate)))
                          w.writeframesraw(struct.pack('<h',max(-32768,min(32767,v))))
          PY
      - name: Install XcodeGen
        run: brew install xcodegen
      - name: Generate Xcode project
        run: xcodegen generate
      - name: Verify original SwiftUI design source
        run: test -s Player/PlayerDesign.swift
      - name: Build app
        run: |
          set -o pipefail
          xcodebuild -project Player.xcodeproj -scheme Player -configuration Release -sdk iphoneos -destination 'generic/platform=iOS' -derivedDataPath build CODE_SIGNING_ALLOWED=NO build 2>&1 | tee xcode-build.log
      - name: Verify demo music is included
        run: |
          APP=build/Build/Products/Release-iphoneos/Player.app
          test -d "$APP"
          test -n "$(find "$APP" -type f -name demo.wav -print -quit)"
      - name: Package unsigned IPA
        run: |
          mkdir -p Payload
          cp -R build/Build/Products/Release-iphoneos/Player.app Payload/
          zip -qr Player-unsigned.ipa Payload
      - uses: actions/upload-artifact@v4
        with:
          name: Player-unsigned-IPA
          path: Player-unsigned.ipa

      - name: Publish downloadable IPA release
        if: github.ref == 'refs/heads/main'
        continue-on-error: true
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          TAG="player-ios-${GITHUB_RUN_NUMBER}"
          gh release create "$TAG" Player-unsigned.ipa --target "$GITHUB_SHA" --title "Player iOS #${GITHUB_RUN_NUMBER}" --notes "Unsigned iPhone IPA. Sign before installation." --prerelease

      - name: Record the actual build result in the repository
        if: always() && github.ref == 'refs/heads/main'
        continue-on-error: true
        run: |
          python3 - <<'PY'
          import os, pathlib
          log = pathlib.Path('xcode-build.log')
          lines = log.read_text(errors='replace').splitlines() if log.exists() else ['Xcode build step never started']
          errors = [line for line in lines if 'error:' in line.lower() or '** BUILD FAILED **' in line]
          success = pathlib.Path('Player-unsigned.ipa').exists()
          report = [
              '# Player iOS build result',
              '',
              f"Source commit: `{os.environ['GITHUB_SHA']}`",
              f"Workflow run: https://github.com/{os.environ['GITHUB_REPOSITORY']}/actions/runs/{os.environ['GITHUB_RUN_ID']}",
              f"Result: {'SUCCESS - IPA created' if success else 'FAILURE - IPA not created'}",
              '',
              '## Compiler errors (if any)',
              '```',
              *(errors[:60] or ['No compiler errors recorded']),
              '```',
              '',
              '## Final build output',
              '```',
              *lines[-25:],
              '```',
          ]
          pathlib.Path('BUILD_STATUS.md').write_text('\n'.join(report) + '\n')
          PY
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git config user.name "github-actions[bot]"
          git fetch origin main
          if [ "$(git rev-parse origin/main)" != "$GITHUB_SHA" ]; then
            echo "Newer commit already exists; skipping obsolete build status."
            exit 0
          fi
          git checkout -B build-report origin/main
          git add BUILD_STATUS.md
          git commit -m "[skip ci] Store verified iOS build outcome"
          git push origin HEAD:main
